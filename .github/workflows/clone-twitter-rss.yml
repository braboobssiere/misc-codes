name: zUpdate Twitter RSS Feed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: feeds/**
          sparse-checkout-cone-mode: false

      # ---- 1. Try the cheap path first: direct fetch, no VPN / Solverr ----
      - name: Try direct RSS fetch (no VPN / Solverr)
        id: direct
        env:
          TWITTER_FEED_URL: ${{ secrets.TWITTER_FEED_URL }}
        run: |
          mkdir -p feeds
          cat > direct_fetch.py <<'PY'
          import os, sys

          try:
              import requests
          except ImportError:
              print("requests module not available", file=sys.stderr)
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("needs_fallback=true\n")
              sys.exit(0)

          TARGET_URL = os.environ.get("TWITTER_FEED_URL", "").strip()
          OUTPUT_FILE = "feeds/twitter_feed.rss"
          GITHUB_OUTPUT = os.environ.get("GITHUB_OUTPUT")

          def set_output(value):
              if GITHUB_OUTPUT:
                  with open(GITHUB_OUTPUT, "a") as f:
                      f.write(f"needs_fallback={value}\n")

          def is_valid_rss(body):
              if not body:
                  return False
              lower = body.lower()
              for marker in ("cf-turnstile", "challenge-platform", "just a moment",
                             "cf_chl_opt", "attention required", "enable javascript"):
                  if marker in lower:
                      return False
              if "<rss" not in lower or "</rss>" not in lower:
                  return False
              if "<item" not in lower:
                  return False
              return True

          if not TARGET_URL:
              print("TWITTER_FEED_URL is empty; using fallback", file=sys.stderr)
              set_output("true")
              sys.exit(0)

          try:
              r = requests.get(TARGET_URL, timeout=30)
              r.raise_for_status()
              body = r.text
          except Exception as e:
              print(f"Direct fetch error: {e}", file=sys.stderr)
              body = ""

          if is_valid_rss(body):
              os.makedirs(os.path.dirname(OUTPUT_FILE), exist_ok=True)
              with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
                  f.write(body)
              print(f"Direct fetch succeeded ({len(body)} bytes) -> {OUTPUT_FILE}",
                    file=sys.stderr)
              set_output("false")
          else:
              print("Direct fetch did not return valid RSS; falling back to VPN + Solverr",
                    file=sys.stderr)
              set_output("true")
          PY
          python3 direct_fetch.py

      # ---- 2. Fallback chain — only runs if direct fetch failed ----
      - name: Setup Dependencies
        if: steps.direct.outputs.needs_fallback == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard-tools

      - name: VPN Setup
        if: steps.direct.outputs.needs_fallback == 'true'
        env:
          PRIMARY_CONFIG: ${{ secrets.WIREGUARD_GRANDCENTRAL }}
          SECONDARY_CONFIG: ${{ secrets.WIREGUARD_TRADEWAR }}
        run: |
          sudo mkdir -p /etc/wireguard/
          WG_CONF="/etc/wireguard/wg0.conf"

          handle_vpn_attempt() {
            local config_content="$1"
            local label="$2"

            echo "$config_content" | sudo tee $WG_CONF > /dev/null
            sudo chmod 600 $WG_CONF

            for i in {1..3}; do
              if timeout 60 sudo wg-quick up wg0; then
                return 0
              fi
              echo "${label^} VPN attempt $i/3 failed"
              sleep 3
            done
            return 1
          }

          if ! handle_vpn_attempt "$PRIMARY_CONFIG" "primary"; then
            echo "::warning::Primary failed - Trying secondary"
            if ! handle_vpn_attempt "$SECONDARY_CONFIG" "secondary"; then
              echo "::error::All VPN configurations failed after 3 attempts each"
              exit 11
            fi
          fi

          if ! sudo wg show wg0 >/dev/null 2>&1; then
            echo "::error::VPN connection verification failed"
            exit 12
          fi

      - name: Start Solverr container
        if: steps.direct.outputs.needs_fallback == 'true'
        run: |
          docker run -d \
            --name solverr \
            -p 8191:8191 \
            --shm-size=512m \
            ghcr.io/unseensnick/solverr:latest

      - name: Wait for Solverr to be ready
        if: steps.direct.outputs.needs_fallback == 'true'
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8191/ | grep -q "FlareSolverr is ready"; then
              echo "Solverr is ready."; exit 0
            fi
            echo "Attempt $i/30 – sleeping 2s..."; sleep 2
          done
          docker logs solverr; exit 1

      - name: Fetch RSS via Solverr (fallback)
        if: steps.direct.outputs.needs_fallback == 'true'
        env:
          TWITTER_FEED_URL: ${{ secrets.TWITTER_FEED_URL }}
        run: |
          mkdir -p feeds
          cat > fetch_rss.py <<'PY'
          import html, json, os, re, sys, time
          import requests

          SOLVERR_URL = "http://localhost:8191/v1"
          TARGET_URL = os.environ["TWITTER_FEED_URL"]
          MAX_TIMEOUT_MS = 60000
          OUTPUT_FILE = "feeds/twitter_feed.rss"

          def clean_rss(body):
              m = re.search(r"<pre[^>]*>(.*?)</pre>", body, re.DOTALL | re.IGNORECASE)
              if m:
                  body = m.group(1)
              stripped = body.lstrip()
              if stripped.startswith("&lt;") or "&lt;rss" in stripped[:200]:
                  body = html.unescape(body)
              start = body.find("<?xml")
              if start == -1:
                  start = body.find("<rss")
              end = body.find("</rss>")
              if start != -1 and end != -1:
                  body = body[start:end + len("</rss>")]
              return body.strip() + "\n"

          def fetch_rss(retries=3):
              payload = {"cmd": "request.get", "url": TARGET_URL, "maxTimeout": MAX_TIMEOUT_MS}
              for attempt in range(1, retries + 1):
                  print(f"[attempt {attempt}/{retries}] Requesting via Solverr...", file=sys.stderr)
                  try:
                      r = requests.post(SOLVERR_URL, json=payload, timeout=180)
                      r.raise_for_status()
                      data = json.loads(r.content.decode("utf-8-sig"))
                  except (requests.RequestException, ValueError) as exc:
                      print(f"Request/parse failed: {exc}", file=sys.stderr)
                      if attempt < retries:
                          time.sleep(5)
                          continue
                      return None
                  body = (data.get("solution") or {}).get("response") or ""
                  if "cf-turnstile" in body or "challenge-platform" in body:
                      print("Got challenge page, retrying...", file=sys.stderr)
                      if attempt < retries:
                          time.sleep(5)
                          continue
                      return None
                  return clean_rss(body)
              return None

          if __name__ == "__main__":
              if not TARGET_URL:
                  print("TWITTER_FEED_URL is empty.", file=sys.stderr)
                  sys.exit(1)
              output_file = sys.argv[1] if len(sys.argv) > 1 else OUTPUT_FILE
              rss = fetch_rss()
              if rss is None:
                  print("Failed to fetch RSS.", file=sys.stderr)
                  sys.exit(1)
              with open(output_file, "w", encoding="utf-8") as f:
                  f.write(rss)
              print(f"Saved RSS to {output_file}", file=sys.stderr)
          PY
          python fetch_rss.py feeds/twitter_feed.rss

      - name: VPN Cleanup
        if: always() && steps.direct.outputs.needs_fallback == 'true'
        run: sudo wg-quick down wg0 || true

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/twitter_feed.rss
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update RSS feed"
            git push
          fi
