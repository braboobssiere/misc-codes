name: zUpdate Twitter RSS Feed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: feeds/**
          sparse-checkout-cone-mode: false

      - name: Download RSS feed
        env:
          FEED_URL: ${{ secrets.TWITTER_FEED_URL }}
        run: |
          mkdir -p feeds
          curl -fsSL "$FEED_URL" -o feeds/twitter_feed.rss

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/twitter_feed.rss
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update twitter_feed.rss"
            git push
          fi
