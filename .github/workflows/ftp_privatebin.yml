name: zDeploy Latest PrivateBin

on:
  schedule:
    - cron: '37 18 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Download & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Checkout repository
      - name: 📂 Checkout version files
        uses: actions/checkout@v7
        with:
          sparse-checkout: input/privatebin/**
          sparse-checkout-cone-mode: false

      # 2. Get latest release and check each instance's version
      - name: 🏷️ Get Latest PrivateBin Release
        run: |
          RELEASE_DATA=$(curl -s https://api.github.com/repos/PrivateBin/PrivateBin/releases/latest)
          LATEST_TAG=$(echo "$RELEASE_DATA" | jq -r '.tag_name')
          ZIP_URL=$(echo "$RELEASE_DATA" | jq -r '.zipball_url')

          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "ERROR: Could not read latest release tag (API rate limit or network issue?)."
            exit 1
          fi

          echo "Latest tag: $LATEST_TAG"
          echo "zip_url=$ZIP_URL" >> "$GITHUB_ENV"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_ENV"

          for N in 1 2; do
            if [ "$N" = "1" ]; then
              FILE="input/privatebin/PrivateBin_version.txt"
            else
              FILE="input/privatebin/PrivateBin_version_2.txt"
            fi

            if [ ! -f "$FILE" ]; then
              echo "0" > "$FILE"
            fi

            OLD_VERSION=$(cat "$FILE")
            echo "Instance $N old version: $OLD_VERSION"

            if [ "$OLD_VERSION" != "$LATEST_TAG" ] && \
               [ "$(printf '%s\n' "$OLD_VERSION" "$LATEST_TAG" | sort -V | tail -n1)" = "$LATEST_TAG" ]; then
              echo "deploy_$N=true" >> "$GITHUB_ENV"
            else
              echo "deploy_$N=false" >> "$GITHUB_ENV"
            fi
          done

      # 3. Download and extract the release ZIP once, if either instance needs it
      - name: 📥 Download and Extract Release ZIP
        if: env.deploy_1 == 'true' || env.deploy_2 == 'true'
        run: |
          mkdir -p privatebin_download
          wget -O release.zip "${{ env.zip_url }}"
          unzip -q release.zip -d privatebin_download
          rm release.zip
          echo "Extracted contents:"
          ls -la privatebin_download/

      # 4. FTP deploy to each outdated instance
      - name: ☁️ FTP Deploy to Instance(s)
        if: env.deploy_1 == 'true' || env.deploy_2 == 'true'
        env:
          FTP_CONFIG_1: ${{ secrets.FTP_PRIVATEBIN }}
          FTP_CONFIG_2: ${{ secrets.FTP_PRIVATEBIN_2 }}
        run: |
          SOURCE_DIR=$(find privatebin_download -maxdepth 1 -type d -iname "PrivateBin-*" | head -1)
          if [ -z "$SOURCE_DIR" ]; then
            echo "ERROR: Could not find extracted PrivateBin directory."
            exit 1
          fi
          echo "Source directory: $SOURCE_DIR"

          sudo apt-get update && sudo apt-get install -y lftp

            # FTP deploy directly from $SOURCE_DIR
            # {
            #   "host": "ftp.example.com", "port": 21, "username": "your_username", "password": "your_password", "remote_folder": "/path/to/remote/folder"
            # }

          deploy_instance() {
            local n="$1"
            local config="$2"
            local version_file="$3"

            local FTP_HOST FTP_PORT FTP_USER FTP_PASS FTP_PATH
            FTP_HOST=$(echo "$config" | jq -r '.host')
            FTP_PORT=$(echo "$config" | jq -r '.port')
            FTP_USER=$(echo "$config" | jq -r '.username')
            FTP_PASS=$(echo "$config" | jq -r '.password')
            FTP_PATH=$(echo "$config" | jq -r '.remote_folder')

            echo "::add-mask::$FTP_HOST"
            echo "::add-mask::$FTP_USER"
            echo "::add-mask::$FTP_PASS"

            echo "=== Deploying instance $n to $FTP_PATH ==="
            lftp -c "
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              open -u '$FTP_USER','$FTP_PASS' -p $FTP_PORT ftp://$FTP_HOST;
              mirror -R --verbose --no-perms --transfer-all \
                --exclude 'cfg/conf.php' \
                --exclude 'ShlinkProxy.php' \
                '$SOURCE_DIR/' '$FTP_PATH'
            " || { echo "ERROR: Deploy failed for instance $n"; return 1; }

            echo "$LATEST_TAG" > "$version_file"
            echo "Instance $n updated to $LATEST_TAG"
          }

          status=0
          if [ "$deploy_1" = "true" ]; then
            deploy_instance 1 "$FTP_CONFIG_1" "input/privatebin/PrivateBin_version.txt" || status=1
          else
            echo "Instance 1 already up to date."
          fi

          if [ "$deploy_2" = "true" ]; then
            deploy_instance 2 "$FTP_CONFIG_2" "input/privatebin/PrivateBin_version_2.txt" || status=1
          else
            echo "Instance 2 already up to date."
          fi

          exit $status

      # 5. Commit whichever version files changed (runs even if one deploy failed)
      - name: 💾 Save New Version State
        if: always() && env.latest_tag != ''
        run: |
          git add input/privatebin/PrivateBin_version*.txt
          if git diff --cached --quiet; then
            echo "No version changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update PrivateBin version state to $LATEST_TAG"
          git push
