<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fishing</title>
<style>
  :root { --border:#d0d7de; --head:#f2f5f8; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 24px; background: #f7f9fb; color: #1b1f24;
  }
  h1 { font-size: 1.4rem; margin: 0 0 16px; }
  .controls { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  select {
    font-size: 1rem; padding: 6px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: #fff;
  }
  section.bait {
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px 18px; margin-bottom: 18px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  section.bait h2 { font-size: 1.05rem; margin: 0 0 10px; }
  table { border-collapse: collapse; width: 100%; font-size: .94rem; }
  th, td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
  thead th { background: var(--head); font-weight: 600; }
  th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  th.sortable:hover { background: #e6ebf0; }
  th .arrow { display: inline-block; width: 1em; opacity: .85; font-size: .8em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.spot { white-space: nowrap; font-weight: 600; }
  .empty { color: #666; }
  #status { margin-bottom: 12px; color: #a33; }
  code { background:#eef1f4; padding:1px 4px; border-radius:4px; }
</style>
</head>
<body>

<h1>Fishing</h1>

<div class="controls">
  <label for="spotSelect"><strong>Spot:</strong></label>
  <select id="spotSelect"></select>

  <label for="baitSelect"><strong>Bait:</strong></label>
  <select id="baitSelect">
    <option value="">All baits</option>
  </select>
</div>

<div id="status"></div>
<div id="output"></div>

<script>
(() => {
  'use strict';

  /* --------------------------------------------------------------
     Relative paths to the JSON files.
     Change DATA_DIR if you keep the files in a subfolder, e.g.
     './data/' or '../json/'.
     -------------------------------------------------------------- */
  const DATA_DIR = './';
  const FILE_LOTTERY = DATA_DIR + 'ParkFishingFishLottery.json';
  const FILE_FISH    = DATA_DIR + 'LangParkFishingFish_Eng.json';
  const FILE_BAIT    = DATA_DIR + 'LangParkFishingBait_Eng.json';

  /* Main spot id -> display name. Sub number is appended automatically. */
  const SPOT_NAMES = {
    '01': 'Fish Blue',
    '02': "Lamy's Snow Dome",
    '03': 'Bokoboko Beacon'
  };

  const RE_SPOT = /^park_fishing_spot-(\d+)-(\d+)/;
  const RE_TIME = /^park_fishing_time_period-(.+)$/;
  const RE_FISH = /fish-(\d+)/;

  const select     = document.getElementById('spotSelect');
  const baitSelect = document.getElementById('baitSelect');
  const output     = document.getElementById('output');
  const status     = document.getElementById('status');

  let lottery = [];
  const fishNames = new Map();   // 'park_fishing_fish-0001' -> 'Sardine'
  const baitNames = new Map();   // 'park_fishing_bait-001' -> 'Fishing Bait'

  /* Per-bait sort state: baitId -> { col, dir } */
  const sortStates = new Map();
  function getSort(baitId) {
    return sortStates.get(baitId) || { col: 'spot', dir: 'asc' };
  }

  /* ---------- helpers ---------- */

  function toArray(json) {
    if (Array.isArray(json)) return json.map(e => (e && e.data) ? e.data : e);
    if (json && typeof json === 'object') {
      return Object.values(json).map(e => (e && e.data) ? e.data : e);
    }
    return [];
  }

  function coreId(id) {
    const i = String(id).indexOf('park_fishing_');
    return i >= 0 ? String(id).slice(i) : String(id);
  }

  function buildNameMap(json) {
    const map = new Map();
    for (const e of toArray(json)) {
      if (!e || typeof e.id !== 'string') continue;
      const cid = coreId(e.id);
      if (cid.endsWith('-name') && typeof e.text === 'string') {
        map.set(cid.slice(0, -'-name'.length), e.text);
      }
    }
    return map;
  }

  function spotParts(id) {
    const m = RE_SPOT.exec(String(id || ''));
    return m ? { main: m[1], sub: m[2] } : null;
  }

  function spotLabel(id) {
    const p = spotParts(id);
    if (!p) return String(id);
    const name = SPOT_NAMES[p.main] || ('Spot ' + p.main);
    return name + ' ' + parseInt(p.sub, 10);
  }

  function timeOf(id) {
    const m = RE_TIME.exec(String(id || ''));
    const t = m ? m[1] : '';
    return (t === 'noon' || t === 'night') ? t : null;
  }

  function fishLabel(id) { return fishNames.get(coreId(id)) || String(id); }
  function baitLabel(id) { return baitNames.get(coreId(id)) || String(id); }

  function fmtPct(v) { return v.toFixed(2) + '%'; }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  function cmpSpot(a, b) {
    const pa = spotParts(a) || { main: '', sub: '0' };
    const pb = spotParts(b) || { main: '', sub: '0' };
    return pa.main.localeCompare(pb.main) ||
           (parseInt(pa.sub, 10) - parseInt(pb.sub, 10));
  }

  function fishNum(id) {
    const m = RE_FISH.exec(String(id || ''));
    return m ? parseInt(m[1], 10) : 0;
  }

  /* ---------- data loading ---------- */

  async function fetchJSON(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(url + ' -> HTTP ' + r.status);
    return r.json();
  }

  async function boot() {
    try {
      const [lot, fishLang, baitLang] = await Promise.all([
        fetchJSON(FILE_LOTTERY),
        fetchJSON(FILE_FISH),
        fetchJSON(FILE_BAIT)
      ]);
      init(lot, fishLang, baitLang);
    } catch (err) {
      status.textContent =
        'Could not load JSON files (' + err.message + '). ' +
        'Make sure the page is served over http(s) and the files are in ' +
        DATA_DIR + '.';
    }
  }

  function init(lot, fishLang, baitLang) {
    lottery = toArray(lot).filter(d => d && d.parkFishingFishId);

    fishNames.clear();
    baitNames.clear();
    for (const [k, v] of buildNameMap(fishLang)) fishNames.set(k, v);
    for (const [k, v] of buildNameMap(baitLang)) baitNames.set(k, v);

    sortStates.clear();

    buildSpotDropdown();
    refreshBaitDropdown();
    render();
    status.textContent = '';
  }

  function buildSpotDropdown() {
    const mains = new Set();
    for (const d of lottery) {
      const p = spotParts(d.parkFishingSpotId);
      if (p) mains.add(p.main);
    }
    const sorted = [...mains].sort();
    select.innerHTML = sorted
      .map(m => `<option value="${esc(m)}">${esc(SPOT_NAMES[m] || 'Spot ' + m)}</option>`)
      .join('');
    if (!sorted.length) {
      output.innerHTML = '<p class="empty">No lottery data found.</p>';
    }
  }

  /* Build bait dropdown from the currently selected spot.
     Always keeps "All baits" as first option and preserves
     the previous selection when possible. */
  function refreshBaitDropdown() {
    const main = select.value;
    const prev = baitSelect.value;

    if (!main) {
      baitSelect.innerHTML = '<option value="">All baits</option>';
      return;
    }

    const entries = lottery.filter(d => {
      const p = spotParts(d.parkFishingSpotId);
      return p && p.main === main;
    });

    const baitSet = new Set();
    for (const d of entries) {
      if (d.parkFishingBaitId) baitSet.add(d.parkFishingBaitId);
    }

    const baitIds = [...baitSet].sort((a, b) =>
      baitLabel(a).localeCompare(baitLabel(b))
    );

    let html = '<option value="">All baits</option>';
    for (const b of baitIds) {
      html += `<option value="${esc(b)}">${esc(baitLabel(b))}</option>`;
    }
    baitSelect.innerHTML = html;

    if (prev && baitSet.has(prev)) baitSelect.value = prev;
  }

  /* ---------- sortable header helper ---------- */

  function thHtml(baitId, col, label, extraClass) {
    const s = getSort(baitId);
    const arrow = s.col === col ? (s.dir === 'asc' ? '▲' : '▼') : '';
    const cls = ['sortable', extraClass || ''].filter(Boolean).join(' ');
    return `<th data-col="${col}" class="${cls}">${esc(label)}<span class="arrow">${arrow}</span></th>`;
  }

  /* ---------- rendering ---------- */

  function render() {
    const main = select.value;
    const baitFilter = baitSelect.value;   // '' means all baits
    if (!main) return;

    const entries = lottery.filter(d => {
      const p = spotParts(d.parkFishingSpotId);
      return p && p.main === main;
    });

    // baitId -> spotId -> fishId -> { noon, night }
    const baits = new Map();
    for (const d of entries) {
      const t = timeOf(d.parkFishingTimePeriodId);
      if (!t) continue;

      const baitId = d.parkFishingBaitId;
      const spotId = d.parkFishingSpotId;
      const fishId = d.parkFishingFishId;

      if (!baits.has(baitId)) baits.set(baitId, new Map());
      const spots = baits.get(baitId);
      if (!spots.has(spotId)) spots.set(spotId, new Map());
      const fish = spots.get(spotId);
      if (!fish.has(fishId)) fish.set(fishId, { noon: 0, night: 0 });

      fish.get(fishId)[t] += Number(d.hitRatio) || 0;
    }

    const sections = [];
    const baitIds = [...baits.keys()].sort();

    for (const baitId of baitIds) {
      if (baitFilter && baitId !== baitFilter) continue;

      const spots = baits.get(baitId);
      const { col, dir } = getSort(baitId);
      const sign = dir === 'asc' ? 1 : -1;

      const spotRows = [];

      for (const spotId of spots.keys()) {
        const fishMap = spots.get(spotId);

        let totalNoon = 0, totalNight = 0;
        for (const v of fishMap.values()) {
          totalNoon  += v.noon;
          totalNight += v.night;
        }

        let list = [...fishMap.entries()]
          .filter(([, v]) => v.noon > 0 || v.night > 0)
          .map(([fid, v]) => ({
            fid,
            noonPct:  totalNoon  > 0 ? (v.noon  / totalNoon)  * 100 : 0,
            nightPct: totalNight > 0 ? (v.night / totalNight) * 100 : 0
          }));

        if (!list.length) continue;

        if (col === 'fish') {
          list.sort((a, b) =>
            sign * fishLabel(a.fid).localeCompare(fishLabel(b.fid)));
        } else if (col === 'noon') {
          list.sort((a, b) => sign * (a.noonPct - b.noonPct));
        } else if (col === 'night') {
          list.sort((a, b) => sign * (a.nightPct - b.nightPct));
        } else {
          list.sort((a, b) => fishNum(a.fid) - fishNum(b.fid));
        }

        spotRows.push({ spotId, list });
      }

      if (col === 'spot') {
        spotRows.sort((a, b) =>
          sign * spotLabel(a.spotId).localeCompare(spotLabel(b.spotId)));
      } else {
        spotRows.sort((a, b) => cmpSpot(a.spotId, b.spotId));
      }

      let rows = '';
      for (const { spotId, list } of spotRows) {
        let first = true;
        for (const item of list) {
          rows += '<tr>';
          if (first) {
            rows += `<td class="spot" rowspan="${list.length}">${esc(spotLabel(spotId))}</td>`;
            first = false;
          }
          rows += `<td>${esc(fishLabel(item.fid))}</td>`;
          rows += `<td class="num">${fmtPct(item.noonPct)}</td>`;
          rows += `<td class="num">${fmtPct(item.nightPct)}</td>`;
          rows += '</tr>';
        }
      }

      if (!rows) continue;

      sections.push(`
        <section class="bait" data-bait-id="${esc(baitId)}">
          <h2># ${esc(baitLabel(baitId))}</h2>
          <table>
            <thead>
              <tr>
                ${thHtml(baitId, 'spot', 'Spot')}
                ${thHtml(baitId, 'fish', 'Fish')}
                ${thHtml(baitId, 'noon', 'Noon', 'num')}
                ${thHtml(baitId, 'night', 'Night', 'num')}
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </section>`);
    }

    output.innerHTML = sections.join('') ||
      '<p class="empty">No fish data for this selection.</p>';
  }

  /* ---------- events ---------- */

  select.addEventListener('change', () => {
    refreshBaitDropdown();
    render();
  });

  baitSelect.addEventListener('change', render);

  output.addEventListener('click', (e) => {
    const th = e.target.closest('th[data-col]');
    if (!th) return;
    const section = th.closest('section.bait');
    if (!section) return;

    const baitId = section.dataset.baitId;
    const col = th.dataset.col;
    const cur = getSort(baitId);

    const dir = (cur.col === col && cur.dir === 'asc') ? 'desc' : 'asc';
    sortStates.set(baitId, { col, dir });
    render();
  });

  boot();
})();
</script>
</body>
</html>
